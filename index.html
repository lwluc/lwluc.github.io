    /* ============================================
       APPLE/FIGMA INSPIRED CLEAN STYLE
       ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html {
      scroll-behavior: smooth;
    }
    
    body {
      width: 100%;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      line-height: 1.5;
      overflow-x: hidden;
    }
    
    /* Loading Screen */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f5f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    
    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    
    .loader-content {
      text-align: center;
    }
    
    .loader-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e5e5ea;
      border-top-color: #0071e3;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loader-text {
      color: #86868b;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: -0.01em;
    }
    
    /* Main scroll container - natural scrolling */
    .scroll-section {
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 4rem 2rem;
      background: #f5f5f7;
    }
    
    /* Hero section with bike */
    #hero {
      min-height: 100vh;
      background: linear-gradient(180deg, #f5f5f7 0%, #ffffff 100%);
    }
    
    /* Bike container - 3D bike centered */
    #bikeContainer {
      position: relative;
      width: 100%;
      height: 60vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 2rem 0;
    }
    
    #threeContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    /* Info sections */
    .info-section {
      max-width: 600px;
      padding: 2rem;
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .info-section.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    .info-section h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    
    .info-section p {
      font-size: clamp(1.25rem, 2.5vw, 1.5rem);
      color: #515154;
      line-height: 1.4;
      margin-bottom: 1rem;
    }
    
    .info-section .subtitle {
      font-size: 1.1rem;
      color: #86868b;
      font-weight: 400;
    }
    
    /* Social icons - clean Apple style */
    .social-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-top: 2rem;
    }
    
    .social-icon {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      color: #86868b;
    }
    
    .social-icon:hover {
      color: #0071e3;
      transform: translateY(-2px);
    }
    
    .social-icon svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }
    
    .social-icon span {
      font-size: 12px;
      font-weight: 400;
      color: #86868b;
      letter-spacing: 0.01em;
    }
    
    .social-icon:hover span {
      color: #0071e3;
    }
    
    /* Individual icon colors */

    .social-icon.github:hover { color: #1d1d1f; }
    .social-icon.gitlab { color: #86868b; }

    /* Footer */

      text-align: center;
      color: #86868b;
      font-size: 14px;
    }
    
    .footer a {
      color: #0071e3;
      text-decoration: none;
    }
    
    .footer a:hover {
      text-decoration: underline;
    }
    
    /* Scroll indicator - minimal */
    #scrollIndicator {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      opacity: 0.5;
      animation: bounce 2s infinite;
    }
    
    #scrollIndicator.hidden {
      display: none;
    }
    
    #scrollIndicator svg {
      width: 16px;
      height: 16px;
      fill: #86868b;
    }
    
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateX(-50%) translateY(0);
      }
      40% {
        transform: translateX(-50%) translateY(-6px);
      }
      60% {
        transform: translateX(-50%) translateY(-3px);
      }
    }
    
    /* Road line - very subtle */

      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      height: 100%;

        transparent 85%, 
        #e5e5ea 90%, 
        #e5e5ea 95%, 
        transparent 100%
      );
      pointer-events: none;
      z-index: 5;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .scroll-section {
        padding: 2rem 1rem;
      }

        gap: 1rem;
      }
      
      .social-icon span {

      }
    }
    
    canvas {
      display: block;
      margin: 0;
      padding: 0;
    }
    
    .block {
      display: block;
    }

  <script>
    // ============================================
    // APPLE/FIGMA STYLE BIKE PORTFOLIO
    // Clean light design, bike rides on scroll
    // ============================================
    
    let scene, camera, renderer;
    let bike, wheels = [];
    let scrollPosition = 0;
    let bikeProgress = 0;
    let infoSections = [];
    
    // Apple/Figma inspired colors
    const colors = {
      background: 0xf5f5f7,
      bikeFrame: 0x1d1d1f,
      bikeAccent: 0x0071e3,
      wheel: 0x1d1d1f,
      wheelRim: 0xc6c6c8,
      trail: 0x0071e3,
      text: 0x1d1d1f
    };
    
    // ============================================
    // INITIALIZE
    // ============================================
    
    function init() {
      createScene();
      createCamera();
      createRenderer();
      createLights();
      createBike();
      setupScroll();
      setupResize();
      
      // Collect info sections
      infoSections = document.querySelectorAll('.info-section');
      
      animate();
      hideLoader();
    }
    
    // ============================================
    // CREATE SCENE
    // ============================================
    
    function createScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(colors.background);
    }
    
    // ============================================
    // CREATE CAMERA
    // ============================================
    
    function createCamera() {
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 10, 25);
      camera.lookAt(0, 5, 0);
    }
    
    // ============================================
    // CREATE RENDERER
    // ============================================
    
    function createRenderer() {
      const container = document.getElementById('threeContainer');
      renderer = new THREE.WebGLRenderer({ 
        antialias: true, 
        alpha: true
      });
      
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      
      container.appendChild(renderer.domElement);
    }
    
    // ============================================
    // CREATE LIGHTS
    // ============================================
    
    function createLights() {
      // Soft ambient
      const ambient = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambient);
      
      // Main light - soft overhead
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(20, 40, 20);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      scene.add(dirLight);
      
      // Fill light for depth
      const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
      fillLight.position.set(-20, 20, -20);
      scene.add(fillLight);
      
      // Subtle accent light
      const accentLight = new THREE.PointLight(colors.bikeAccent, 0.2, 30);
      accentLight.position.set(0, 10, 0);
      scene.add(accentLight);
    }
    
    // ============================================
    // CREATE BIKE - Clean Apple style
    // ============================================
    
    function createBike() {
      const bikeGroup = new THREE.Group();
      
      // Frame - sleek and thin
      const frameGeometry = new THREE.BoxGeometry(14, 0.5, 0.4);
      const frameMaterial = new THREE.MeshStandardMaterial({ 
        color: colors.bikeFrame,
        metalness: 0.9,
        roughness: 0.1
      });
      const frame = new THREE.Mesh(frameGeometry, frameMaterial);
      frame.position.set(0, 5, 0);
      bikeGroup.add(frame);
      
      // Seat tube
      const seatTubeGeometry = new THREE.CylinderGeometry(0.2, 0.2, 5, 16);
      const seatTube = new THREE.Mesh(seatTubeGeometry, frameMaterial);
      seatTube.position.set(0, 7.5, 0);
      seatTube.rotation.x = Math.PI / 4;
      bikeGroup.add(seatTube);
      
      // Front wheel
      const wheelFront = createWheel();
      wheelFront.position.set(5, 2.5, 0);
      bikeGroup.add(wheelFront);
      wheels.push(wheelFront);
      
      // Back wheel
      const wheelBack = createWheel();
      wheelBack.position.set(-5, 2.5, 0);
      bikeGroup.add(wheelBack);
      wheels.push(wheelBack);
      
      // Handlebar
      const handlebarGeometry = new THREE.CylinderGeometry(0.15, 0.15, 4, 8);
      const handlebar = new THREE.Mesh(handlebarGeometry, frameMaterial);
      handlebar.position.set(5, 6, 0);
      handlebar.rotation.z = Math.PI / 4;
      bikeGroup.add(handlebar);
      
      // Saddle - minimal
      const saddleGeometry = new THREE.BoxGeometry(1.2, 0.2, 0.5);
      const saddle = new THREE.Mesh(saddleGeometry, frameMaterial);
      saddle.position.set(0, 10, 0);
      saddle.rotation.x = Math.PI / 8;
      bikeGroup.add(saddle);
      
      // Pedals
      const pedalGeometry = new THREE.CylinderGeometry(0.1, 0.1, 1.5, 8);
      const pedalMaterial = new THREE.MeshStandardMaterial({ color: colors.bikeFrame });
      
      const pedalLeft = new THREE.Mesh(pedalGeometry, pedalMaterial);
      pedalLeft.position.set(0, 3.5, 0.5);
      bikeGroup.add(pedalLeft);
      
      const pedalRight = new THREE.Mesh(pedalGeometry, pedalMaterial);
      pedalRight.position.set(0, 3.5, -0.5);
      bikeGroup.add(pedalRight);
      
      // Accent line on frame (like Apple's aesthetic)
      const accentGeometry = new THREE.BoxGeometry(14.1, 0.05, 0.05);
      const accentMaterial = new THREE.MeshBasicMaterial({ color: colors.bikeAccent });
      const accent = new THREE.Mesh(accentGeometry, accentMaterial);
      accent.position.set(0, 5.25, 0);
      bikeGroup.add(accent);
      
      scene.add(bikeGroup);
      bike = bikeGroup;
      bike.position.set(0, 0, -5);
    }
    
    function createWheel() {
      const wheelGroup = new THREE.Group();
      
      // Tire - thin
      const tireGeometry = new THREE.TorusGeometry(1.8, 0.15, 16, 32);
      const tireMaterial = new THREE.MeshStandardMaterial({ 
        color: colors.wheel,
        roughness: 0.8,
        metalness: 0.1
      });
      const tire = new THREE.Mesh(tireGeometry, tireMaterial);
      tire.rotation.x = Math.PI / 2;
      wheelGroup.add(tire);
      
      // Rim - clean metal
      const rimGeometry = new THREE.TorusGeometry(1.85, 0.08, 16, 32);
      const rimMaterial = new THREE.MeshStandardMaterial({ 
        color: colors.wheelRim,
        metalness: 1.0,
        roughness: 0.1
      });
      const rim = new THREE.Mesh(rimGeometry, rimMaterial);
      rim.rotation.x = Math.PI / 2;
      wheelGroup.add(rim);
      
      // Subtle spokes
      for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2;
        const spokeGeometry = new THREE.CylinderGeometry(0.04, 0.04, 1.7, 6);
        const spokeMaterial = new THREE.MeshStandardMaterial({ color: colors.wheelRim });
        const spoke = new THREE.Mesh(spokeGeometry, spokeMaterial);
        spoke.position.set(Math.cos(angle) * 1.6, 0, Math.sin(angle) * 1.6);
        spoke.rotation.x = Math.PI / 2;
        spoke.rotation.z = angle;
        wheelGroup.add(spoke);
      }
      
      return wheelGroup;
    }
    
    // ============================================
    // SCROLL HANDLING
    // ============================================
    
    function setupScroll() {
      // Use natural window scroll
      window.addEventListener('scroll', () => {
        scrollPosition = window.scrollY || window.pageYOffset;
        
        // Calculate progress (0 to 1)
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        bikeProgress = Math.min(1, scrollPosition / docHeight);
        
        // Bike moves forward on Z axis
        const bikeZ = -5 - (bikeProgress * 150);
        bike.position.z = bikeZ;
        
        // Wheels rotate based on distance
        wheels.forEach(w => {
          w.rotation.z = bikeProgress * 10;
        });
        
        // Camera follows
        camera.position.z = 25 + (bikeProgress * 100);
        camera.position.y = 10 + (bikeProgress * 5);
        camera.lookAt(0, 5, bikeZ);
        
        // Hide scroll indicator
        const scrollIndicator = document.getElementById('scrollIndicator');
        if (scrollPosition > 50) {
          scrollIndicator.classList.add('hidden');
        } else {
          scrollIndicator.classList.remove('hidden');
        }
        
        // Show info sections based on scroll position
        infoSections.forEach((section, index) => {
          const triggerPoint = (index + 1) * 0.2; // 20%, 40%, 60%, 80%, 100%
          
          if (bikeProgress > triggerPoint - 0.1 && bikeProgress < triggerPoint + 0.1) {
            section.classList.add('visible');
          } else {
            section.classList.remove('visible');
          }
        });
      });
      
      // Trigger initial check
      window.dispatchEvent(new Event('scroll'));
    }
    
    // ============================================
    // RESIZE HANDLING
    // ============================================
    
    function setupResize() {
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }
    
    // ============================================
    // ANIMATION LOOP
    // ============================================
    
    function animate() {
      requestAnimationFrame(animate);
      
      // Subtle wheel animation when not scrolling
      if (wheels.length > 0) {
        wheels[0].rotation.z += 0.005;
        wheels[1].rotation.z += 0.005;
      }
      
      // Subtle bike sway
      bike.position.x = Math.sin(Date.now() * 0.0005) * 0.3;
      
      renderer.render(scene, camera);
    }
    
    // ============================================
    // LOADER
    // ============================================
    
    function hideLoader() {
      setTimeout(() => {
        const loader = document.getElementById('loader');
        loader.classList.add('hidden');
      }, 500);
    }
    
    // ============================================
    // INITIALIZE
    // ============================================
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
