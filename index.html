<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>luc weinbrecht</title>
  <meta name="description" content="luc weinbrecht - Software Architect and BPM Consultant, living in Karlsruhe" />
  <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="apple-touch-icon" href="img/apple-icon.png" />

  <style>
    /* ============================================
       APPLE/FIGMA INSPIRED CLEAN STYLE
       ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      width: 100%;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Loading Screen */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f5f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-content {
      text-align: center;
    }

    .loader-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e5e5ea;
      border-top-color: #0071e3;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      color: #86868b;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    /* Main scroll sections */
    .scroll-section {
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      background: #f5f5f7;
    }

    /* Hero section with bike */
    #hero {
      min-height: 100vh;
      background: linear-gradient(180deg, #f5f5f7 0%, #ffffff 100%);
    }

    /* Bike container - centered */
    #bikeContainer {
      position: relative;
      width: 100%;
      height: 70vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
    }

    /* SVG Bike - Professional racing bike */
    #svgBike {
      position: absolute;
      width: 500px;
      height: auto;
      max-width: 90vw;
      z-index: 10;
      transition: transform 0.1s ease-out;
      transform-origin: center 125px;
    }

    /* Road line - very subtle */
    #roadLine {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      height: 100%;
      background: linear-gradient(to bottom,
        transparent 0%,
        #e5e5ea 5%,
        #e5e5ea 8%,
        transparent 12%,
        transparent 88%,
        #e5e5ea 92%,
        #e5e5ea 95%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 5;
    }

    /* Info sections - LARGE TEXT */
    .info-section {
      max-width: 900px;
      padding: 4rem 2rem;
      text-align: center;
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 0.8s cubic-bezier(0.25, 0.1, 0.25, 1), transform 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .info-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .info-section h1 {
      font-size: clamp(4rem, 10vw, 7rem);
      font-weight: 700;
      color: #1d1d1f;
      margin-bottom: 1rem;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .info-section h2 {
      font-size: clamp(3rem, 8vw, 5rem);
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .info-section p {
      font-size: clamp(1.75rem, 3.5vw, 2.25rem);
      color: #515154;
      line-height: 1.4;
      margin-bottom: 1rem;
    }

    .info-section .subtitle {
      font-size: clamp(1.5rem, 3vw, 2rem);
      color: #86868b;
      font-weight: 400;
      line-height: 1.5;
    }

    /* Social icons - clean Apple style with better visibility */
    .social-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
      margin-top: 3rem;
    }

    .social-icon {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      transition: all 0.2s ease;
      color: #1d1d1f; /* Dark for maximum visibility */
    }

    .social-icon:hover {
      color: #0071e3;
      transform: translateY(-3px);
    }

    .social-icon svg {
      width: 36px;
      height: 36px;
      fill: currentColor;
    }

    .social-icon span {
      font-size: 13px;
      font-weight: 400;
      color: #1d1d1f;
      letter-spacing: 0.01em;
    }

    .social-icon:hover span {
      color: #0071e3;
    }

    /* Individual icon colors on hover */
    .social-icon.github:hover { color: #1d1d1f; }
    .social-icon.gitlab:hover { color: #fc6d26; }
    .social-icon.linkedin:hover { color: #0077b5; }
    .social-icon.blog:hover { color: #0071e3; }
    .social-icon.sessionize:hover { color: #1ab394; }
    .social-icon.muchskill:hover { color: #f2d361; }

    /* Footer */
    .footer {
      padding: 4rem 2rem;
      text-align: center;
      color: #86868b;
      font-size: 14px;
    }

    .footer a {
      color: #0071e3;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* Scroll indicator - minimal */
    #scrollIndicator {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      opacity: 0.5;
      animation: bounce 2s infinite;
    }

    #scrollIndicator.hidden {
      display: none;
    }

    #scrollIndicator svg {
      width: 18px;
      height: 18px;
      fill: #86868b;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateX(-50%) translateY(0);
      }
      40% {
        transform: translateX(-50%) translateY(-8px);
      }
      60% {
        transform: translateX(-50%) translateY(-4px);
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .scroll-section {
        padding: 1rem;
      }

      #bikeContainer {
        height: 60vh;
      }

      #svgBike {
        width: 400px;
      }

      .social-icons {
        gap: 1.5rem;
      }

      .social-icon span {
        display: none;
      }
    }

    @media (max-width: 480px) {
      #svgBike {
        width: 300px;
      }

      .social-icons {
        gap: 1rem;
      }

      .social-icon svg {
        width: 32px;
        height: 32px;
      }
    }

    .block {
      display: block;
    }

    /* Smooth animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>

        <line x1="70" y1="140" x2="70" y2="115" stroke="#1d1d1f" stroke-width="10" stroke-linecap="round"/>
        
        <!-- ===== HANDLEBAR ===== -->

        <!-- Handle -->

        <!-- Handle grips -->

        <!-- ===== SADDLE ===== -->

        <circle cx="55" cy="195" r="30" fill="none" stroke="#e5e5ea" stroke-width="2"/>
        <!-- Front axle -->
        <circle cx="55" cy="195" r="5" fill="#86868b"/>
        <!-- Front spokes (8 spokes at 45deg intervals) -->

          <line x1="55" y1="195" x2="55" y2="157"/>
          <line x1="55" y1="195" x2="55" y2="233"/>

          <line x1="55" y1="195" x2="77" y2="222"/>
          <line x1="55" y1="195" x2="33" y2="168"/>
          <line x1="55" y1="195" x2="33" y2="222"/>
        </g>
        
        <!-- Rear wheel -->
        <circle cx="270" cy="195" r="38" fill="none" stroke="#1d1d1f" stroke-width="4"/>
        <circle cx="270" cy="195" r="30" fill="none" stroke="#e5e5ea" stroke-width="2"/>
        <!-- Rear axle -->
        <circle cx="270" cy="195" r="5" fill="#86868b"/>
        <!-- Rear spokes (8 spokes at 45deg intervals) -->
        <g stroke="#c6c6c8" stroke-width="1.2">
          <line x1="270" y1="195" x2="270" y2="157"/>
          <line x1="270" y1="195" x2="270" y2="233"/>
          <line x1="270" y1="195" x2="232" y2="195"/>
          <line x1="270" y1="195" x2="308" y2="195"/>

          <line x1="270" y1="195" x2="248" y2="168"/>
          <line x1="270" y1="195" x2="248" y2="222"/>
        </g>
        
        <!-- ===== PEDALS & CRANK ===== -->
        <!-- Outside pedal ring -->
        <circle cx="160" cy="195" r="25" fill="none" stroke="#1d1d1f" stroke-width="4"/>
        
        <!-- Crank arms -->
        <line x1="160" y1="195" x2="120" y2="195" stroke="#1d1d1f" stroke-width="9" stroke-linecap="round"/>
        <line x1="160" y1="195" x2="200" y2="195" stroke="#1d1d1f" stroke-width="9" stroke-linecap="round"/>
        
        <!-- Pedal stems -->
        <line x1="120" y1="185" x2="120" y2="205" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>
        <line x1="200" y1="185" x2="200" y2="205" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Inside pedal dots -->
        <circle cx="120" cy="195" r="4" fill="#1d1d1f"/>
        <circle cx="200" cy="195" r="4" fill="#1d1d1f"/>
        
        <!-- Pedal bases -->

        <rect x="185" y="188" width="30" height="14" fill="#1d1d1f" rx="2" transform="rotate(0 200 195)"/>

        <!-- ===== WATER BOTTLE ===== -->
        <ellipse cx="145" cy="175" rx="4" ry="8" fill="#0071e3" opacity="0.6"/>
        <rect x="142" y="175" width="6" height="16" fill="#0071e3" opacity="0.6" rx="2"/>
      </svg>
    </div>

      <svg viewBox="0 0 24 24">
        <path d="M12 4l8 8h-6v8h-4v-8H4l8-8z" fill="currentColor"/>

  <script>
    // ============================================
    // CLEAN RACING BIKE PORTFOLIO
    // Apple/Figma style with extra large text
    // ============================================

    let bike, scrollPosition = 0, bikeProgress = 0;
    let infoSections = [];

    // ============================================
    // INITIALIZE
    // ============================================

    function init() {
      bike = document.getElementById('svgBike');
      infoSections = document.querySelectorAll('.info-section');

      setupScroll();
      setupResize();

      hideLoader();
    }

    // ============================================
    // SCROLL HANDLING
    // ============================================

    function setupScroll() {
      window.addEventListener('scroll', () => {
        scrollPosition = window.scrollY || window.pageYOffset;

        // Calculate progress (0 to 1)
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        bikeProgress = Math.min(1, scrollPosition / docHeight);

        // Bike moves to the right and slightly down, with lean
        const bikeX = bikeProgress * 300;
        const bikeY = bikeProgress * 10;
        const bikeRotate = bikeProgress * 6;

        bike.style.transform = `translate(${bikeX}px, ${bikeY}px) rotate(${bikeRotate}deg)`;

        // Wheels rotate - updated for SASI bike coordinates
        const frontWheel = bike.querySelector('circle[cx="55"][cy="195"]');
        const backWheel = bike.querySelector('circle[cx="270"][cy="195"]');
        const wheelRotation = bikeProgress * 720; // Two full rotations

        if (frontWheel) frontWheel.style.transform = `rotate(${wheelRotation}deg)`;
        if (backWheel) backWheel.style.transform = `rotate(${wheelRotation}deg)`;

        // Pedals rotate - for SASI bike (r=4 circles for pedal dots)
        const pedals = bike.querySelectorAll('circle[cx="120"][cy="195"], circle[cx="200"][cy="195"]');
        pedals.forEach((pedal, index) => {
          pedal.style.transform = `rotate(${wheelRotation * (index === 0 ? 1 : -1)}deg)`;
        });

        // Hide scroll indicator
        const scrollIndicator = document.getElementById('scrollIndicator');
        if (scrollPosition > 50) {
          scrollIndicator.classList.add('hidden');
        } else {
          scrollIndicator.classList.remove('hidden');
        }

        // Show info sections based on scroll position
        infoSections.forEach((section, index) => {
          const triggerPoint = (index + 1) * 0.16; // ~16%, 32%, 48%, 64%, 80%, 96%

          if (bikeProgress > triggerPoint - 0.04 && bikeProgress < triggerPoint + 0.04) {
            section.classList.add('visible');
          } else {
            section.classList.remove('visible');
          }
        });
      });

      // Trigger initial check
      window.dispatchEvent(new Event('scroll'));
    }

    // ============================================
    // RESIZE HANDLING
    // ============================================

    function setupResize() {
      window.addEventListener('resize', () => {
        // Adjust bike size based on viewport
        const bikeContainer = document.getElementById('bikeContainer');
        const containerHeight = bikeContainer.clientHeight;
        const scale = containerHeight / 250;
        bike.style.transform = `scale(${scale})`;
      });

      // Initial resize
      window.dispatchEvent(new Event('resize'));
    }

    // ============================================
    // LOADER
    // ============================================

    function hideLoader() {
      setTimeout(() => {
        const loader = document.getElementById('loader');
        loader.classList.add('hidden');
      }, 300);
    }

    // ============================================
    // INITIALIZE
    // ============================================

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
