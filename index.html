  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (function(){
      const scene=new THREE.Scene();
      const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
      const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('canvas'),antialias:false,alpha:true});
      renderer.setSize(window.innerWidth,window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
      renderer.setClearColor(0xf5f5f7,0);

      const colors={umlClass:0x4a90d9,bpmnStart:0x5cb85c,bpmnTask:0xf0ad4e,bpmnGateway:0xd9534f,line:0xd2d2d7};

      function createClassBox(){
        const geometry=new THREE.BoxGeometry(1.5,2,0.5);
        const material=new THREE.MeshBasicMaterial({color:colors.umlClass,transparent:true,opacity:0.7});
        return new THREE.Mesh(geometry,material);
      }

      function createTask(){
        const geometry=new THREE.BoxGeometry(2,1,0.5);
        const material=new THREE.MeshBasicMaterial({color:colors.bpmnTask,transparent:true,opacity:0.7});
        return new THREE.Mesh(geometry,material);
      }

      function createGateway(){
        const geometry=new THREE.ConeGeometry(1,2,4);
        geometry.rotateX(Math.PI/2);
        const geometry2=new THREE.ConeGeometry(1,2,4);
        geometry2.rotateX(-Math.PI/2);
        const material=new THREE.MeshBasicMaterial({color:colors.bpmnGateway,transparent:true,opacity:0.7});
        const mesh1=new THREE.Mesh(geometry,material);
        const mesh2=new THREE.Mesh(geometry2,material);
        const group=new THREE.Group();
        group.add(mesh1);
        group.add(mesh2);
        return group;
      }

      function createStartEvent(){
        const geometry=new THREE.SphereGeometry(0.8,16,16);
        const material=new THREE.MeshBasicMaterial({color:colors.bpmnStart,transparent:true,opacity:0.7});
        return new THREE.Mesh(geometry,material);
      }

      function createEndEvent(){
        const geometry=new THREE.TorusGeometry(0.8,0.2,16,32);
        const material=new THREE.MeshBasicMaterial({color:0xd9534f,transparent:true,opacity:0.7});
        return new THREE.Mesh(geometry,material);
      }

      const elements=[];
      const types=['class','task','gateway','start','end'];
      const creators={class:createClassBox,task:createTask,gateway:createGateway,start:createStartEvent,end:createEndEvent};

      for(let i=0;i<15;i++){
        const type=types[Math.floor(Math.random()*types.length)];
        const element=creators[type]();
        element.position.set(
          (Math.random()-0.5)*25,
          (Math.random()-0.5)*15,
          (Math.random()-0.5)*15
        );
        element.scale.multiplyScalar(0.8+Math.random()*0.4);
        if(type==='gateway') element.rotation.y=Math.random()*Math.PI;
        elements.push({mesh:element,speed:0.05+Math.random()*0.1,type:type});
        scene.add(element);
      }

      const lineGeometry=new THREE.BufferGeometry();
      const lineMaterial=new THREE.LineBasicMaterial({color:colors.line,transparent:true,opacity:0.3});
      const linePoints=[];
      for(let i=0;i<15;i++){
        linePoints.push(
          new THREE.Vector3((Math.random()-0.5)*30,Math.random()*20,(Math.random()-0.5)*20),
          new THREE.Vector3((Math.random()-0.5)*30,Math.random()*20,(Math.random()-0.5)*20)
        );
      }
      lineGeometry.setFromPoints(linePoints);
      scene.add(new THREE.LineSegments(lineGeometry,lineMaterial));

      camera.position.z=25;

      let mouseX=0,mouseY=0;
      let targetX=0,targetY=0;

      function onMouseMove(e){
        mouseX=(e.clientX/window.innerWidth)*2-1;
        mouseY=-(e.clientY/window.innerHeight)*2+1;
      }

      function onResize(){
        camera.aspect=window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth,window.innerHeight);
      }

      window.addEventListener('mousemove',onMouseMove);
      window.addEventListener('resize',onResize);

      function animate(){
        requestAnimationFrame(animate);
        targetX+=((mouseX*2)-targetX)*0.03;
        targetY+=((mouseY*2)-targetY)*0.03;
        camera.position.x+=((targetX*15)-camera.position.x)*0.05;
        camera.position.y+=((-targetY*10)-camera.position.y)*0.05;
        camera.lookAt(scene.position);

        elements.forEach((e,i)=>{
          e.mesh.rotation.x+=0.003*e.speed;
          e.mesh.rotation.y+=0.005*e.speed;
          if(e.type==='gateway') e.mesh.rotation.z+=0.002*e.speed;
        });

        renderer.render(scene,camera);
      }
      animate();
    })();
  </script>
