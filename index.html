  <style>
    /* ============================================
       RESET & BASE STYLES
       ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    body {
      background: #000000;
      color: #ffffff;
      cursor: default;
    }
    
    /* Scroll container for 3D navigation */
    #scrollContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    
    #scrollContent {
      height: 500vh;
      position: relative;
    }
    
    /* Canvas container */
    #threeContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    /* ============================================
       LOADING SCREEN
       ============================================ */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 1000;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    
    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    
    .loader-content {
      text-align: center;
    }
    
    .loader-text {
      color: #00ffff;
      font-size: 1.2rem;
      margin-bottom: 2rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.8;
    }
    
    .loader-bar {
      width: 200px;
      height: 4px;
      background: rgba(0, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }
    
    .loader-progress {
      height: 100%;
      background: linear-gradient(90deg, #00ffff, #00a2ff, #00ffff);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 2px;
    }
    
    .loader-percentage {
      margin-top: 1rem;
      color: #00ffff;
      font-size: 1rem;
      opacity: 0.8;
    }
    
    /* ============================================
       INFO OVERLAY
       ============================================ */
    #infoOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }
    
    #infoOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease, visibility 1s ease;
    }
    
    .info-content {
      text-align: center;
      padding: 2rem;
      max-width: 800px;
    }
    
    .title-main {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 700;
      color: #00ffff;
      margin-bottom: 1rem;
      letter-spacing: 0.1em;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.5), 
                   0 0 40px rgba(0, 255, 255, 0.3);
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.8s ease forwards 0.2s;
    }
    
    .title-sub {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      color: #666;
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.8s ease forwards 0.4s;
    }
    
    .bio-text {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: #888;
      line-height: 1.8;
      margin-bottom: 3rem;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.8s ease forwards 0.6s;
    }
    
    .social-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
      margin-bottom: 3rem;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.8s ease forwards 0.8s;
    }
    
    .social-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      pointer-events: auto;
      transition: all 0.3s ease;
    }
    
    .social-icon:hover {
      transform: translateY(-5px) scale(1.1);
    }
    
    .social-icon svg {
      width: 48px;
      height: 48px;
      fill: currentColor;
      transition: all 0.3s ease;
    }
    
    .social-icon:hover svg {
      filter: drop-shadow(0 0 15px currentColor);
    }
    
    .social-icon span {
      font-size: 0.85rem;
      color: #666;
      letter-spacing: 0.05em;
      transition: color 0.3s ease;
    }
    
    .social-icon:hover span {
      color: #00ffff;
    }
    
    /* GitHub - Cyan */
    .social-icon.github { color: #00ffff; }
    .social-icon.github:hover { color: #00a2ff; }
    
    /* GitLab - Orange */
    .social-icon.gitlab { color: #fc6d26; }
    .social-icon.gitlab:hover { color: #ff8d42; }
    
    /* LinkedIn - Blue */
    .social-icon.linkedin { color: #0077b5; }
    .social-icon.linkedin:hover { color: #005580; }
    
    /* Blog - Light Blue */
    .social-icon.blog { color: #00a2ff; }
    .social-icon.blog:hover { color: #0077b5; }
    
    /* Sessionize - Green */
    .social-icon.sessionize { color: #1ab394; }
    .social-icon.sessionize:hover { color: #16a085; }
    
    /* MuchSkills - Yellow */
    .social-icon.muchskill { color: #f2d361; }
    .social-icon.muchskill:hover { color: #f5e68e; }
    
    .footer-text {
      font-size: 0.85rem;
      color: #444;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.8s ease forwards 1s;
    }
    
    .footer-text a {
      color: #00ffff;
      text-decoration: none;
      border-bottom: 1px solid rgba(0, 255, 255, 0.3);
      transition: all 0.3s ease;
    }
    
    .footer-text a:hover {
      color: #00a2ff;
      border-bottom-color: #00a2ff;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* ============================================
       SCROLL INDICATOR
       ============================================ */
    #scrollIndicator {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      opacity: 0.8;
      animation: bounce 2s infinite;
    }
    
    #scrollIndicator.hidden {
      display: none;
    }
    
    #scrollIndicator svg {
      width: 24px;
      height: 24px;
      fill: #00ffff;
    }
    
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateX(-50%) translateY(0);
      }
      40% {
        transform: translateX(-50%) translateY(-10px);
      }
      60% {
        transform: translateX(-50%) translateY(-5px);
      }
    }
    
    /* ============================================
       MOBILE ADJUSTMENTS
       ============================================ */
    @media (max-width: 768px) {
      .social-icons {
        gap: 1.5rem;
      }
      
      .social-icon svg {
        width: 36px;
        height: 36px;
      }
      
      .social-icon span {
        font-size: 0.75rem;
      }
    }
    
    @media (max-width: 480px) {
      .social-icon span {
        display: none;
      }
      
      .social-icons {
        gap: 1rem;
      }
      
      .social-icon svg {
        width: 32px;
        height: 32px;
      }
    }
    
    /* ============================================
       RESET FOR THREE.JS CANVAS
       ============================================ */
    canvas {
      display: block;
      margin: 0;
      padding: 0;
    }
    
    .block {
      display: block;
    }
    
    /* Scroll progress bar */
    #scrollProgress {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(0, 0, 0, 0.5);
      z-index: 200;
    }
    
    #scrollProgressBar {
      height: 100%;
      background: linear-gradient(90deg, #00ffff, #00a2ff, #ff2a6d);
      width: 0%;
      transition: width 0.1s ease;
    }
  </style>
</head>

  <script>
    // ============================================
    // MAIN 3D PORTFOLIO SCENE
    // ============================================
    
    let scene, camera, renderer;
    let particles = [];
    let shapes = [];
    let textMeshes = [];
    let lights = [];
    let scrollPosition = 0;
    let mouseX = 0, mouseY = 0;
    let targetMouseX = 0, targetMouseY = 0;
    
    // Colors - Clean black with neon accents
    const colors = {
      background: 0x000000,
      primary: 0x00ffff,   // Cyan
      secondary: 0x00a2ff, // Blue
      accent: 0xff2a6d,    // Pink/Red
      accent2: 0xfc6d26,  // Orange
      white: 0xffffff,
      gray: 0x333333
    };
    
    // ============================================
    // INITIALIZE
    // ============================================
    
    function init() {
      // Create scene
      createScene();
      
      // Create camera
      createCamera();
      
      // Create renderer
      createRenderer();
      
      // Create lights
      createLights();
      
      // Create particles
      createParticles();
      
      // Create floating shapes
      createFloatingShapes();
      
      // Create 3D text
      create3DText();
      
      // Setup scroll listener
      setupScroll();
      
      // Setup mouse movement
      setupMouse();
      
      // Setup resize listener
      setupResize();
      
      // Start animation
      animate();
      
      // Hide loader after a delay
      setTimeout(hideLoader, 1500);
    }
    
    // ============================================
    // CREATE SCENE
    // ============================================
    
    function createScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(colors.background);
      // Very subtle fog for depth, almost invisible
      scene.fog = new THREE.Fog(colors.background, 100, 500);
    }
    
    // ============================================
    // CREATE CAMERA
    // ============================================
    
    function createCamera() {
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 120);
      camera.lookAt(0, 0, 0);
    }
    
    // ============================================
    // CREATE RENDERER
    // ============================================
    
    function createRenderer() {
      const container = document.getElementById('threeContainer');
      renderer = new THREE.WebGLRenderer({ 
        antialias: true, 
        alpha: true
      });
      
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      
      container.appendChild(renderer.domElement);
    }
    
    // ============================================
    // CREATE LIGHTS
    // ============================================
    
    function createLights() {
      // Ambient light - very subtle
      const ambientLight = new THREE.AmbientLight(0x333333, 0.2);
      scene.add(ambientLight);
      lights.push(ambientLight);
      
      // Main directional light - cyan
      const dirLight1 = new THREE.DirectionalLight(colors.primary, 0.8);
      dirLight1.position.set(50, 50, 50);
      dirLight1.castShadow = true;
      dirLight1.shadow.mapSize.width = 2048;
      dirLight1.shadow.mapSize.height = 2048;
      scene.add(dirLight1);
      lights.push(dirLight1);
      
      // Second directional light - subtle contrast
      const dirLight2 = new THREE.DirectionalLight(colors.accent, 0.3);
      dirLight2.position.set(-50, -30, 50);
      scene.add(dirLight2);
      lights.push(dirLight2);
      
      // Point light 1 - moving cyan highlight
      const pointLight1 = new THREE.PointLight(colors.primary, 1, 200);
      pointLight1.position.set(30, 30, 30);
      scene.add(pointLight1);
      lights.push(pointLight1);
      
      // Point light 2 - moving orange accent
      const pointLight2 = new THREE.PointLight(colors.accent2, 0.5, 200);
      pointLight2.position.set(-40, -20, -30);
      scene.add(pointLight2);
      lights.push(pointLight2);
      
      // Hemisphere light for subtle ambient color
      const hemiLight = new THREE.HemisphereLight(colors.primary, colors.accent, 0.1);
      scene.add(hemiLight);
      lights.push(hemiLight);
    }
    
    // ============================================
    // CREATE PARTICLES (1500+)
    // ============================================
    
    function createParticles() {
      const particleCount = 1500;
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const colors = [];
      
      for (let i = 0; i < particleCount; i++) {
        const x = (Math.random() - 0.5) * 400;
        const y = (Math.random() - 0.5) * 400;
        const z = (Math.random() - 0.5) * 400;
        
        positions.push(x, y, z);
        
        // Random colors from palette
        const colorOptions = [colors.primary, colors.secondary, colors.accent, colors.accent2, colors.white];
        const color = new THREE.Color(colorOptions[Math.floor(Math.random() * colorOptions.length)]);
        colors.push(color.r, color.g, color.b);
      }
      
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      
      const material = new THREE.PointsMaterial({
        size: 0.4,
        vertexColors: true,
        transparent: true,
        opacity: 0.8,
        sizeAttenuation: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      
      const particlesMesh = new THREE.Points(geometry, material);
      scene.add(particlesMesh);
      particles.push(particlesMesh);
    }
    
    // ============================================
    // CREATE FLOATING SHAPES
    // ============================================
    
    function createFloatingShapes() {
      const shapeCount = 25;
      const geometryOptions = [
        new THREE.BoxGeometry(6, 6, 6),
        new THREE.SphereGeometry(4, 24, 24),
        new THREE.TorusGeometry(4, 1.5, 12, 24),
        new THREE.DodecahedronGeometry(5),
        new THREE.IcosahedronGeometry(4),
        new THREE.ConeGeometry(3, 6, 24),
        new THREE.CylinderGeometry(2.5, 2.5, 6, 24)
      ];
      
      const colorOptions = [colors.primary, colors.secondary, colors.accent, colors.accent2, colors.white];
      
      for (let i = 0; i < shapeCount; i++) {
        const geometry = geometryOptions[Math.floor(Math.random() * geometryOptions.length)];
        const color = colorOptions[Math.floor(Math.random() * colorOptions.length)];
        
        const material = new THREE.MeshStandardMaterial({
          color: color,
          metalness: 0.3,
          roughness: 0.3,
          emissive: new THREE.Color(color),
          emissiveIntensity: 0.15
        });
        
        const mesh = new THREE.Mesh(geometry, material);
        
        // Position shapes in layers based on scroll
        mesh.position.set(
          (Math.random() - 0.5) * 300,
          (Math.random() - 0.5) * 300,
          (Math.random() - 0.5) * 300
        );
        
        mesh.rotation.set(
          Math.random() * Math.PI * 2,
          Math.random() * Math.PI * 2,
          Math.random() * Math.PI * 2
        );
        
        mesh.userData = {
          rotationSpeed: {
            x: (Math.random() - 0.5) * 0.01,
            y: (Math.random() - 0.5) * 0.01,
            z: (Math.random() - 0.5) * 0.01
          },
          floatSpeed: Math.random() * 0.5 + 0.5,
          floatOffset: Math.random() * Math.PI * 2,
          basePosition: mesh.position.clone(),
          baseScale: 1,
          scrollDepth: Math.random() * 200 - 100  // Each shape has its own scroll depth
        };
        
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        
        scene.add(mesh);
        shapes.push(mesh);
      }
    }
    
    // ============================================
    // CREATE 3D TEXT
    // ============================================
    
    function create3DText() {
      const fontLoader = new THREE.FontLoader();
      
      // Load Helvetiker font
      fontLoader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_regular.typeface.js', function(font) {
        // Create "luc weinbrecht" text
        createTextMesh(font, 'luc weinbrecht', 8, 3, 0, 20, -50, colors.primary);
        
        // Create subtitle
        createTextMesh(font, 'Software Architect & BPM Consultant', 2.5, 1, 0, -8, -50, colors.secondary);
        
        // Create "living in Karlsruhe"
        createTextMesh(font, 'living in Karlsruhe', 2, 0.5, 0, -20, -50, colors.white);
      });
    }
    
    function createTextMesh(font, text, size, height, bevelThickness, yPos, zPos, color) {
      const textGeometry = new THREE.TextGeometry(text, {
        font: font,
        size: size,
        height: height,
        curveSegments: 12,
        bevelEnabled: bevelThickness > 0,
        bevelThickness: bevelThickness,
        bevelSize: bevelThickness * 1.5,
        bevelOffset: 0,
        bevelSegments: 5
      });
      
      textGeometry.computeBoundingBox();
      const textWidth = textGeometry.boundingBox.max.x - textGeometry.boundingBox.min.x;
      
      // Main text mesh
      const textMaterial = new THREE.MeshStandardMaterial({
        color: color,
        metalness: 0.8,
        roughness: 0.2,
        emissive: new THREE.Color(color),
        emissiveIntensity: 0.2
      });
      
      const textMesh = new THREE.Mesh(textGeometry, textMaterial);
      textMesh.position.set(-textWidth / 2, yPos, zPos);
      textMesh.castShadow = true;
      textMesh.receiveShadow = true;
      scene.add(textMesh);
      textMeshes.push(textMesh);
      
      // Glow effect mesh
      const glowMaterial = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.2,
        side: THREE.DoubleSide
      });
      
      const glowMesh = new THREE.Mesh(textGeometry, glowMaterial);
      glowMesh.position.copy(textMesh.position);
      glowMesh.scale.multiplyScalar(1.02);
      scene.add(glowMesh);
      textMeshes.push(glowMesh);
    }
    
    // ============================================
    // SCROLL HANDLING - Enhanced with parallax effects
    // ============================================
    
    function setupScroll() {
      const scrollContainer = document.getElementById('scrollContainer');
      const progressBar = document.getElementById('scrollProgressBar');
      
      scrollContainer.addEventListener('scroll', () => {
        scrollPosition = scrollContainer.scrollTop;
        
        // Calculate scroll percentage (0 to 1)
        const maxScroll = scrollContainer.scrollHeight - window.innerHeight;
        const scrollPercent = Math.min(1, scrollPosition / maxScroll);
        
        // Update progress bar
        progressBar.style.width = (scrollPercent * 100) + '%';
        
        // Camera moves in a dramatic curved path through 3D space
        const radius = 250;
        const theta = scrollPercent * Math.PI * 2;
        
        // Enhanced spiral motion with more drama
        camera.position.x = Math.sin(theta * 0.5) * radius * 0.8;
        camera.position.y = scrollPercent * 180 - 90;
        camera.position.z = Math.cos(theta * 0.4) * radius * 0.7 + 120;
        
        // Dynamic lookAt that follows the path
        const lookAtY = scrollPercent * 60 - 30;
        camera.lookAt(0, lookAtY, -80);
        
        // Hide scroll indicator after first scroll
        const scrollIndicator = document.getElementById('scrollIndicator');
        if (scrollPosition > 50) {
          scrollIndicator.classList.add('hidden');
        } else {
          scrollIndicator.classList.remove('hidden');
        }
        
        // Update overlay opacity - fade out as you scroll
        const overlay = document.getElementById('infoOverlay');
        overlay.style.opacity = Math.max(0, 1 - scrollPercent * 2);
        
        // ===== SCROLL PARALLAX EFFECTS =====
        // Move shapes based on scroll position and their depth
        shapes.forEach((shape, index) => {
          const depth = shape.userData.scrollDepth;
          const scrollFactor = scrollPercent * depth * 0.01;
          
          // Apply parallax: shapes with different depths move at different speeds
          shape.position.x += Math.sin(theta * 0.3 + index) * scrollFactor * 2;
          shape.position.y += Math.cos(theta * 0.2 + index) * scrollFactor * 1.5;
          shape.position.z += scrollFactor * 0.5;
          
          // Scale effect: shapes grow slightly as you scroll
          const scaleFactor = 1 + scrollPercent * 0.3;
          shape.scale.setScalar(scaleFactor);
          
          // Rotation effect: shapes spin based on scroll
          shape.rotation.x += scrollPercent * 0.01 * index;
          shape.rotation.y += scrollPercent * 0.01 * (index * 0.5);
        });
        
        // Move particles with scroll for depth effect
        particles.forEach((particleMesh, index) => {
          const particleGeometry = particleMesh.geometry;
          if (particleGeometry.attributes.position) {
            const positions = particleGeometry.attributes.position.array;
            // Apply subtle parallax to particles
            for (let i = 0; i < positions.length; i += 3) {
              const depthFactor = (i / positions.length) * 0.5;
              positions[i] += Math.sin(theta * 0.1) * scrollPercent * depthFactor * 0.1;
              positions[i + 1] += Math.cos(theta * 0.15) * scrollPercent * depthFactor * 0.05;
            }
            particleGeometry.attributes.position.needsUpdate = true;
          }
        });
        
        // Text parallax: text moves slightly backwards as you scroll
        textMeshes.forEach((mesh, index) => {
          const depth = -100 - (index * 10);
          mesh.position.z = depth + (scrollPercent * 50);
        });
      });
    }
    
    // ============================================
    // MOUSE MOVEMENT
    // ============================================
    
    function setupMouse() {
      document.addEventListener('mousemove', (event) => {
        mouseX = (event.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
      });
    }
    
    // ============================================
    // RESIZE HANDLING
    // ============================================
    
    function setupResize() {
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }
    
    // ============================================
    // ANIMATION LOOP
    // ============================================
    
    function animate() {
      requestAnimationFrame(animate);
      
      const time = Date.now() * 0.001;
      
      // Smooth mouse following for camera
      targetMouseX = mouseX * 5;
      targetMouseY = mouseY * 5;
      
      // Rotate particles slightly
      particles.forEach((particleMesh, index) => {
        particleMesh.rotation.x += 0.00005 * index;
        particleMesh.rotation.y += 0.00003 * (index * 0.7);
      });
      
      // Animate floating shapes with additional time-based movement
      shapes.forEach((shape, index) => {
        shape.rotation.x += shape.userData.rotationSpeed.x;
        shape.rotation.y += shape.userData.rotationSpeed.y;
        shape.rotation.z += shape.userData.rotationSpeed.z;
        
        // Floating animation (sin wave) - subtle
        const floatFactor = Math.sin(time * shape.userData.floatSpeed + shape.userData.floatOffset);
        shape.position.y = shape.userData.basePosition.y + floatFactor * 2;
      });
      
      // Animate lights - creates dynamic lighting effects
      if (lights.length > 2) {
        lights[2].position.x = Math.sin(time * 0.3) * 50;
        lights[2].position.y = Math.cos(time * 0.5) * 50;
        lights[2].position.z = Math.cos(time * 0.4) * 40;
        
        lights[3].position.x = Math.cos(time * 0.4) * 60;
        lights[3].position.y = Math.sin(time * 0.3) * 40;
        lights[3].position.z = Math.sin(time * 0.6) * 50;
      }
      
      // Smooth camera movement based on mouse
      camera.position.x += (targetMouseX - camera.position.x) * 0.02;
      camera.position.y += (targetMouseY - camera.position.y) * 0.02;
      
      // Text glow pulse
      textMeshes.forEach((mesh, index) => {
        if (mesh.material && mesh.material.emissiveIntensity) {
          mesh.material.emissiveIntensity = 0.2 + Math.sin(time * 2 + index) * 0.05;
        }
      });
      
      renderer.render(scene, camera);
    }
    
    // ============================================
    // LOADER
    // ============================================
    
    function hideLoader() {
      const loader = document.getElementById('loader');
      const overlay = document.getElementById('infoOverlay');
      const scrollIndicator = document.getElementById('scrollIndicator');
      
      loader.style.transition = 'opacity 0.8s ease, visibility 0.8s ease';
      loader.style.opacity = '0';
      loader.style.visibility = 'hidden';
      
      overlay.classList.remove('hidden');
      scrollIndicator.classList.remove('hidden');
    }
    
    // ============================================
    // INITIALIZE WHEN DOM IS READY
    // ============================================
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
    
    // Prevent default touch behavior for better mobile experience
    document.addEventListener('touchmove', (e) => {
      // Allow scrolling on touch devices
    }, { passive: true });
  </script>
</body>
