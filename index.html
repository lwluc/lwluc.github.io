  <style>
    /* ============================================
       RESET & BASE STYLES
       ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #000000 50%, #0a0a0a 100%);
      color: #ffffff;
      cursor: default;
      overflow-x: hidden;
    }
    
    /* Scroll container */
    #scrollContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    
    #scrollContent {
      height: 1000vh;
      position: relative;
    }
    
    /* Canvas container */
    #threeContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    /* Info sections - positioned where bike has passed */
    .info-section {
      position: absolute;
      width: 100%;
      padding: 2rem;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      color: #888;
    }
    
    .info-section.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    .info-section h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      color: #00ffff;
      margin-bottom: 0.5rem;
      letter-spacing: 0.1em;
    }
    
    .info-section p {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: #888;
      line-height: 1.8;
      margin-bottom: 1rem;
    }
    
    .social-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-top: 2rem;
    }
    
    .social-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      pointer-events: auto;
      transition: all 0.3s ease;
      color: #666;
    }
    
    .social-icon:hover {
      transform: translateY(-5px);
      color: #00ffff;
    }
    
    .social-icon svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
      transition: all 0.3s ease;
    }
    
    .social-icon:hover svg {
      filter: drop-shadow(0 0 10px currentColor);
    }
    
    .social-icon span {
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }
    
    /* GitHub */
    .social-icon.github { color: #00ffff; }
    .social-icon.gitlab { color: #fc6d26; }
    .social-icon.linkedin { color: #0077b5; }
    .social-icon.blog { color: #00a2ff; }
    .social-icon.sessionize { color: #1ab394; }
    .social-icon.muchskill { color: #f2d361; }
    
    /* Loading Screen */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 1000;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    
    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    
    .loader-content {
      text-align: center;
    }
    
    .loader-text {
      color: #00ffff;
      font-size: 1rem;
      margin-bottom: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    
    /* Road effect - subtle center line */
    #road {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 100%;
      background: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(255,255,255,0.1) 10%, 
        rgba(255,255,255,0.1) 20%, 
        transparent 30%, 
        transparent 70%, 
        rgba(255,255,255,0.1) 80%, 
        rgba(255,255,255,0.1) 90%, 
        transparent 100%
      );
      pointer-events: none;
      z-index: 5;
    }
    
    /* Scroll indicator */
    #scrollIndicator {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      opacity: 0.6;
      animation: bounce 2s infinite;
    }
    
    #scrollIndicator.hidden {
      display: none;
    }
    
    #scrollIndicator svg {
      width: 20px;
      height: 20px;
      fill: #00ffff;
    }
    
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateX(-50%) translateY(0);
      }
      40% {
        transform: translateX(-50%) translateY(-8px);
      }
      60% {
        transform: translateX(-50%) translateY(-4px);
      }
    }
    
    /* Fade in animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Mobile adjustments */
    @media (max-width: 768px) {
      .social-icons {
        gap: 1rem;
      }
      .social-icon svg {
        width: 24px;
        height: 24px;
      }
      .social-icon span {
        display: none;
      }
      .info-section h1 {
        font-size: 2rem;
      }
    }
    
    canvas {
      display: block;
      margin: 0;
      padding: 0;
    }
    
    .block {
      display: block;
    }
  </style>
</head>

  <script>
    // ============================================
    // BIKE SCROLL PORTFOLIO
    // Modern bike rides as you scroll, info appears behind
    // ============================================
    
    let scene, camera, renderer;
    let bike, wheels = [], trail = [];
    let scrollPosition = 0;
    let bikePosition = 0;
    let infoSections = [];
    
    // Colors
    const colors = {
      background: 0x0a0a0a,
      bikeFrame: 0x222222,
      bikeAccent: 0x00ffff,
      wheel: 0x111111,
      wheelRim: 0x333333,
      trail: 0x00ffff,
      text: 0x888888
    };
    
    // ============================================
    // INITIALIZE
    // ============================================
    
    function init() {
      createScene();
      createCamera();
      createRenderer();
      createLights();
      createBike();
      createTrail();
      setupScroll();
      setupResize();
      animate();
      
      // Collect info sections
      infoSections = document.querySelectorAll('.info-section');
      
      setTimeout(hideLoader, 1000);
    }
    
    // ============================================
    // CREATE SCENE
    // ============================================
    
    function createScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(colors.background);
    }
    
    // ============================================
    // CREATE CAMERA
    // ============================================
    
    function createCamera() {
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 15, 30);
      camera.lookAt(0, 5, 0);
    }
    
    // ============================================
    // CREATE RENDERER
    // ============================================
    
    function createRenderer() {
      const container = document.getElementById('threeContainer');
      renderer = new THREE.WebGLRenderer({ 
        antialias: true, 
        alpha: true
      });
      
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      
      container.appendChild(renderer.domElement);
    }
    
    // ============================================
    // CREATE LIGHTS
    // ============================================
    
    function createLights() {
      // Ambient
      const ambient = new THREE.AmbientLight(0x404040, 0.4);
      scene.add(ambient);
      
      // Main light - above
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 30, 20);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      scene.add(dirLight);
      
      // Fill light
      const fillLight = new THREE.DirectionalLight(0x00a2ff, 0.3);
      fillLight.position.set(-20, 10, -10);
      scene.add(fillLight);
      
      // Accent light for bike
      const accentLight = new THREE.PointLight(colors.bikeAccent, 0.5, 50);
      accentLight.position.set(0, 10, 5);
      scene.add(accentLight);
    }
    
    // ============================================
    // CREATE BIKE
    // ============================================
    
    function createBike() {
      const bikeGroup = new THREE.Group();
      
      // Frame - simple geometry
      const frameGeometry = new THREE.BoxGeometry(12, 0.8, 0.5);
      const frameMaterial = new THREE.MeshStandardMaterial({ 
        color: colors.bikeFrame,
        metalness: 0.8,
        roughness: 0.3
      });
      const frame = new THREE.Mesh(frameGeometry, frameMaterial);
      frame.position.set(0, 6, 0);
      frame.castShadow = true;
      bikeGroup.add(frame);
      
      // Seat tube
      const seatTubeGeometry = new THREE.CylinderGeometry(0.3, 0.3, 4, 16);
      const seatTube = new THREE.Mesh(seatTubeGeometry, frameMaterial);
      seatTube.position.set(0, 8, 0);
      seatTube.rotation.x = Math.PI / 4;
      bikeGroup.add(seatTube);
      
      // Front wheel
      const wheelFront = createWheel();
      wheelFront.position.set(4, 3, 0);
      bikeGroup.add(wheelFront);
      wheels.push(wheelFront);
      
      // Back wheel
      const wheelBack = createWheel();
      wheelBack.position.set(-4, 3, 0);
      bikeGroup.add(wheelBack);
      wheels.push(wheelBack);
      
      // Pedals
      const pedalGeometry = new THREE.CylinderGeometry(0.2, 0.2, 2, 8);
      const pedalMaterial = new THREE.MeshStandardMaterial({ color: colors.bikeFrame });
      
      const pedalLeft = new THREE.Mesh(pedalGeometry, pedalMaterial);
      pedalLeft.position.set(0, 4, 1);
      bikeGroup.add(pedalLeft);
      
      const pedalRight = new THREE.Mesh(pedalGeometry, pedalMaterial);
      pedalRight.position.set(0, 4, -1);
      bikeGroup.add(pedalRight);
      
      // Handlebar
      const handlebarGeometry = new THREE.CylinderGeometry(0.2, 0.2, 3, 8);
      const handlebar = new THREE.Mesh(handlebarGeometry, frameMaterial);
      handlebar.position.set(4, 7, 0);
      handlebar.rotation.z = Math.PI / 4;
      bikeGroup.add(handlebar);
      
      // Saddle
      const saddleGeometry = new THREE.BoxGeometry(1.5, 0.3, 0.8);
      const saddle = new THREE.Mesh(saddleGeometry, frameMaterial);
      saddle.position.set(0, 10, 0);
      saddle.rotation.x = Math.PI / 6;
      bikeGroup.add(saddle);
      
      // Add glowing accent to frame
      const frameGlow = new THREE.Mesh(frameGeometry, new THREE.MeshBasicMaterial({
        color: colors.bikeAccent,
        transparent: true,
        opacity: 0.2,
        wireframe: false
      }));
      frameGlow.position.copy(frame.position);
      frameGlow.scale.multiplyScalar(1.02);
      bikeGroup.add(frameGlow);
      
      scene.add(bikeGroup);
      bike = bikeGroup;
      bike.position.set(0, 0, -10);
    }
    
    function createWheel() {
      const wheelGroup = new THREE.Group();
      
      // Tire
      const tireGeometry = new THREE.TorusGeometry(2, 0.3, 16, 32);
      const tireMaterial = new THREE.MeshStandardMaterial({ 
        color: colors.wheel,
        roughness: 0.8
      });
      const tire = new THREE.Mesh(tireGeometry, tireMaterial);
      tire.rotation.x = Math.PI / 2;
      wheelGroup.add(tire);
      
      // Rim
      const rimGeometry = new THREE.TorusGeometry(2.1, 0.1, 16, 32);
      const rimMaterial = new THREE.MeshStandardMaterial({ 
        color: colors.wheelRim,
        metalness: 0.9,
        roughness: 0.2
      });
      const rim = new THREE.Mesh(rimGeometry, rimMaterial);
      rim.rotation.x = Math.PI / 2;
      wheelGroup.add(rim);
      
      // Spokes (simplified)
      for (let i = 0; i < 8; i++) {
        const spokeGeometry = new THREE.CylinderGeometry(0.05, 0.05, 2, 8);
        const spokeMaterial = new THREE.MeshStandardMaterial({ color: colors.wheelRim });
        const spoke = new THREE.Mesh(spokeGeometry, spokeMaterial);
        const angle = (i / 8) * Math.PI * 2;
        spoke.position.set(Math.cos(angle) * 1.8, 0, Math.sin(angle) * 1.8);
        spoke.rotation.x = Math.PI / 2;
        spoke.rotation.z = angle;
        wheelGroup.add(spoke);
      }
      
      return wheelGroup;
    }
    
    // ============================================
    // CREATE TRAIL
    // ============================================
    
    function createTrail() {
      // Trail will be created dynamically as bike moves
    }
    
    // ============================================
    // SCROLL HANDLING
    // ============================================
    
    function setupScroll() {
      const scrollContainer = document.getElementById('scrollContainer');
      
      scrollContainer.addEventListener('scroll', () => {
        scrollPosition = scrollContainer.scrollTop;
        
        // Calculate scroll percentage and bike progress
        const maxScroll = scrollContainer.scrollHeight - window.innerHeight;
        const scrollPercent = Math.min(1, scrollPosition / maxScroll);
        
        // Bike moves forward as you scroll
        bikePosition = scrollPercent * 200;
        bike.position.z = -10 - bikePosition;
        
        // Wheels rotate based on distance traveled
        wheels.forEach(wheel => {
          wheel.rotation.z = bikePosition * 0.5;
        });
        
        // Camera follows bike with slight delay
        camera.position.x = 0;
        camera.position.y = 15;
        camera.position.z = 30 + bikePosition * 0.5;
        camera.lookAt(0, 5, -10 - bikePosition);
        
        // Hide scroll indicator
        const scrollIndicator = document.getElementById('scrollIndicator');
        if (scrollPosition > 50) {
          scrollIndicator.classList.add('hidden');
        } else {
          scrollIndicator.classList.remove('hidden');
        }
        
        // Show info sections based on bike position
        infoSections.forEach(section => {
          const sectionPos = parseFloat(section.getAttribute('data-position')) || 0;
          const sectionElement = section;
          
          // Section becomes visible when bike passes it
          if (bikePosition > sectionPos - 50 && bikePosition < sectionPos + 100) {
            sectionElement.classList.add('visible');
          } else {
            sectionElement.classList.remove('visible');
          }
          
          // Position section in 3D space (behind bike)
          const sectionDepth = (bikePosition - sectionPos) * 0.5;
          sectionElement.style.transform = `translateY(${sectionDepth * 0.2}px) translateZ(${sectionDepth}px)`;
          sectionElement.style.opacity = Math.min(1, Math.max(0, 1 - Math.abs(bikePosition - sectionPos) / 100));
        });
        
        // Add trail effect - create particles where bike has been
        addTrailParticles(bikePosition);
      });
    }
    
    // ============================================
    // TRAIL EFFECT
    // ============================================
    
    function addTrailParticles(position) {
      // Add a new trail particle every 10 scroll units
      if (Math.floor(position) % 10 === 0 && trail.length < 50) {
        const trailGeometry = new THREE.SphereGeometry(0.3, 8, 8);
        const trailMaterial = new THREE.MeshBasicMaterial({
          color: colors.trail,
          transparent: true,
          opacity: 0.6
        });
        const trailParticle = new THREE.Mesh(trailGeometry, trailMaterial);
        
        trailParticle.position.set(
          0,
          3,
          -10 - position + Math.random() * 2
        );
        
        scene.add(trailParticle);
        trail.push({
          mesh: trailParticle,
          position: position,
          life: 100
        });
      }
      
      // Remove old trail particles
      trail = trail.filter(t => {
        t.life--;
        t.mesh.material.opacity = t.life / 100;
        return t.life > 0;
      });
    }
    
    // ============================================
    // RESIZE HANDLING
    // ============================================
    
    function setupResize() {
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }
    
    // ============================================
    // ANIMATION LOOP
    // ============================================
    
    function animate() {
      requestAnimationFrame(animate);
      
      // Animate wheels (subtle rotation when not moving)
      if (wheels.length > 0) {
        wheels[0].rotation.z += 0.01;
        wheels[1].rotation.z += 0.01;
      }
      
      // Animate trail particles - fade out
      trail.forEach(t => {
        t.mesh.position.y += Math.sin(Date.now() * 0.001 + t.position * 0.1) * 0.1;
      });
      
      renderer.render(scene, camera);
    }
    
    // ============================================
    // LOADER
    // ============================================
    
    function hideLoader() {
      const loader = document.getElementById('loader');
      loader.style.transition = 'opacity 0.5s ease, visibility 0.5s ease';
      loader.style.opacity = '0';
      loader.style.visibility = 'hidden';
    }
    
    // ============================================
    // INITIALIZE
    // ============================================
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
